name: Continuous Deployment (Production)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push router image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.router
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ferrum-router:${{ github.sha }}

      - name: Build and push ws-stream image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.ws-stream
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ferrum-ws-stream:${{ github.sha }}

      - name: Build and push db-processor image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.db-processor
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ferrum-db-processor:${{ github.sha }}

      - name: Build and push engine image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.engine
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ferrum-engine:${{ github.sha }}

      - name: Update deploy manifests and push
        env:
          PAT: ${{ secrets.PAT }}
          DEPLOY_REPO: ${{ secrets.DEPLOY_MANIFESTS_REPO }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${PAT}@github.com/${DEPLOY_REPO}.git" deploy-manifests
          cd deploy-manifests
          PREFIX="${{ secrets.DOCKER_USERNAME }}"
          SHA="${{ github.sha }}"
          sed -i "s|image: .*/ferrum-router:.*|image: ${PREFIX}/ferrum-router:${SHA}|" backend/deployment.yml
          sed -i "s|image: .*/ferrum-ws-stream:.*|image: ${PREFIX}/ferrum-ws-stream:${SHA}|" websocket/deployment.yml
          sed -i "s|image: .*/ferrum-db-processor:.*|image: ${PREFIX}/ferrum-db-processor:${SHA}|" db-processor/deployment.yml
          sed -i "s|image: .*/ferrum-engine:.*|image: ${PREFIX}/ferrum-engine:${SHA}|" engine/deployment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "deploy: bump images ${SHA}"
          git push "https://x-access-token:${PAT}@github.com/${DEPLOY_REPO}.git" HEAD:main
